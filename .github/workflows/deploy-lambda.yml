name: Deploy Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies into package dir
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -t backend/package
      - name: Copy source
        run: |
          cp -r backend/src backend/package/
      - name: Zip
        run: |
          cd backend/package
          zip -r ../function.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Deploy or update Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
        run: |
          set -e

          # Check if Lambda function exists
          if aws lambda get-function --function-name "$FUNCTION_NAME" 2>/dev/null; then
            echo "Lambda function exists, updating code..."
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/function.zip
          else
            echo "Lambda function does not exist, creating..."
            if [ -z "$ROLE_ARN" ]; then
              echo "ERROR: LAMBDA_ROLE_ARN secret is required for creating new function"
              exit 1
            fi
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.11 \
              --role "$ROLE_ARN" \
              --handler backend.src.handler.handler \
              --zip-file fileb://backend/function.zip \
              --timeout 30 \
              --memory-size 256
            echo "Lambda function created. Please set environment variables in AWS Lambda console."
          fi
