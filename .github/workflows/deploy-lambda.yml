name: Deploy Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies into package dir
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -t backend/package --no-cache-dir
      - name: Strip package to fit Lambda direct-upload size limit
        run: |
          # === Drop entire package + its dist-info for unused deps ===
          drop_pkg() {
            local pkg="$1"
            rm -rf "backend/package/${pkg}"
            rm -rf backend/package/${pkg}-*.dist-info 2>/dev/null || true
            rm -rf backend/package/${pkg//-/_}-*.dist-info 2>/dev/null || true
          }
          for pkg in boto3 botocore s3transfer urllib3 jmespath; do
            drop_pkg "$pkg"
          done
          for pkg in uvicorn uvloop httptools websockets watchfiles; do
            drop_pkg "$pkg"
          done

          # === Drop unused SQLAlchemy dialects + extensions ===
          for d in postgresql mssql oracle sqlite sybase firebird; do
            rm -rf "backend/package/sqlalchemy/dialects/$d"
          done
          rm -rf backend/package/sqlalchemy/testing
          rm -rf backend/package/sqlalchemy/ext/mypy
          rm -rf backend/package/sqlalchemy/cyextension

          # === Trim cryptography submodules not used for JWT ===
          rm -rf backend/package/cryptography/x509
          rm -rf backend/package/cryptography/hazmat/decrepit
          rm -rf backend/package/cryptography/hazmat/primitives/twofactor
          rm -f backend/package/cryptography/fernet.py

          # === pydantic v1 compatibility shim (we're on pydantic 2) ===
          rm -rf backend/package/pydantic/v1

          # === Generic cleanup ===
          find backend/package -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find backend/package -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.pyi" \) -delete
          find backend/package -type d \( -name "tests" -o -name "test" -o -name "docs" -o -name "examples" -o -name "samples" \) -exec rm -rf {} + 2>/dev/null || true
          find backend/package -type f \( -iname "README*" -o -iname "CHANGELOG*" -o -iname "CHANGES*" -o -iname "HISTORY*" -o -iname "AUTHORS*" -o -iname "NOTICE*" -o -iname "*.md" -o -iname "*.rst" \) -delete

          # === Strip debug symbols from native .so files ===
          # cryptography/_openssl.abi3.so, pydantic_core/_pydantic_core.so,
          # bcrypt/_bcrypt.so, greenlet/_greenlet.so all ship with debug
          # symbol tables. Stripping removes them without affecting
          # runtime behavior. Saves 1-3 MB across all .so files.
          find backend/package -type f -name "*.so" -exec strip --strip-unneeded {} + 2>/dev/null || true

          # === Strip unused passlib handlers ===
          # passlib ships ~50 hash scheme handlers. App uses bcrypt only.
          if [ -d backend/package/passlib/handlers ]; then
            cd backend/package/passlib/handlers
            for f in *.py; do
              case "$f" in
                __init__.py|bcrypt.py|misc.py|argon2.py)
                  ;;
                *)
                  rm -f "$f"
                  ;;
              esac
            done
            cd - >/dev/null
          fi

          # === dist-info: nuke entirely ===
          find backend/package -maxdepth 1 -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true

          echo "Package size after strip:"
          du -sh backend/package
          echo "Top 15 fattest top-level packages:"
          du -sm backend/package/*/ 2>/dev/null | sort -rn | head -15
      - name: Copy source
        run: |
          cp -r backend/src/* backend/package/
      - name: Zip
        run: |
          cd backend/package
          zip -9Xqr ../function.zip .
          cd ..
          echo "function.zip size:"
          ls -lh function.zip
      - name: Verify zip fits under direct-upload limit
        run: |
          ZIP_SIZE=$(stat -c%s backend/function.zip)
          LIMIT=52000000
          echo "function.zip raw size: $ZIP_SIZE bytes (limit: $LIMIT)"
          if [ "$ZIP_SIZE" -gt "$LIMIT" ]; then
            echo "ERROR: function.zip is too large for Lambda direct upload."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Deploy or update Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
        run: |
          set -e

          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Lambda function exists, updating code..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://backend/function.zip >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"

            echo "Updating function configuration..."
            for attempt in 1 2 3 4 5; do
              if aws lambda update-function-configuration \
                --function-name "$FUNCTION_NAME" \
                --runtime python3.11 \
                --handler handler.handler \
                --timeout 30 \
                --memory-size 256 >/dev/null 2>conf_err.log; then
                echo "Configuration updated."
                rm -f conf_err.log
                break
              fi
              if grep -q ResourceConflictException conf_err.log; then
                echo "Attempt $attempt: function still updating, retrying in 5s..."
                sleep 5
                aws lambda wait function-updated --function-name "$FUNCTION_NAME" || true
                continue
              fi
              cat conf_err.log >&2
              exit 1
            done
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          else
            echo "Lambda function does not exist, creating..."
            if [ -z "$ROLE_ARN" ]; then
              echo "ERROR: LAMBDA_ROLE_ARN secret is required for creating new function"
              exit 1
            fi
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.11 \
              --role "$ROLE_ARN" \
              --handler handler.handler \
              --zip-file fileb://backend/function.zip \
              --timeout 30 \
              --memory-size 256 >/dev/null 2>&1
            aws lambda wait function-active-v2 --function-name "$FUNCTION_NAME"
            echo "Lambda function created. Please set environment variables in AWS Lambda console."
          fi
      - name: Ensure Function URL exists (do not regenerate)
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          set -e

          CORS_FILE=$(mktemp)
          CORS_JSON='{"AllowOrigins":["*"],"AllowMethods":["GET","POST"],"AllowHeaders":["Content-Type","Authorization","X-Scraper-Secret"],"MaxAge":3600}'
          printf '%s' "$CORS_JSON" > "$CORS_FILE"

          if aws lambda get-function-url-config --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Function URL exists - updating CORS only (URL stays the same)."
            aws lambda update-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors file://"$CORS_FILE" \
              --query 'FunctionUrl' --output text
          else
            echo "Function URL does not exist - creating for the first time."
            aws lambda create-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --auth-type NONE \
              --cors file://"$CORS_FILE" \
              --query 'FunctionUrl' --output text
          fi

          rm -f "$CORS_FILE"

          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id AllowPublicInvokeFunctionUrl \
            --action lambda:InvokeFunctionUrl \
            --principal '*' \
            --function-url-auth-type NONE >/dev/null 2>&1 \
            && echo "Added AllowPublicInvokeFunctionUrl permission" \
            || echo "AllowPublicInvokeFunctionUrl permission already present"

          echo "Final Function URL config:"
          aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionUrl:FunctionUrl,AuthType:AuthType,Cors:Cors}' \
            --output json
