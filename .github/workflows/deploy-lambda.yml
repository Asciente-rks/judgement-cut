name: Deploy Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies into package dir
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -t backend/package
      - name: Copy source
        run: |
          mkdir -p backend/package/backend
          cp -r backend/src backend/package/backend/
      - name: Zip
        run: |
          cd backend/package
          zip -r ../function.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Deploy or update Lambda
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
        run: |
          set -e

          # Check if Lambda function exists (suppress stdout/stderr to avoid leaking env variables)
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Lambda function exists, updating code..."
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/function.zip >/dev/null 2>&1
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.11 \
              --handler backend.src.handler.handler \
              --timeout 30 \
              --memory-size 256 >/dev/null 2>&1
          else
            echo "Lambda function does not exist, creating..."
            if [ -z "$ROLE_ARN" ]; then
              echo "ERROR: LAMBDA_ROLE_ARN secret is required for creating new function"
              exit 1
            fi
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime python3.11 \
              --role "$ROLE_ARN" \
              --handler backend.src.handler.handler \
              --zip-file fileb://backend/function.zip \
              --timeout 30 \
              --memory-size 256 >/dev/null 2>&1
            echo "Lambda function created. Please set environment variables in AWS Lambda console."
          fi
      - name: Create or update Function URL
        env:
          FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          set -e

          # Create or update Function URL using a temp JSON file to avoid quoting/parsing issues
          CORS_FILE=$(mktemp)
          CORS_JSON='{"AllowOrigins":["*"],"AllowMethods":["GET","POST"],"AllowHeaders":["Content-Type","Authorization","X-Scraper-Secret"],"MaxAge":3600}'
          printf '%s' "$CORS_JSON" > "$CORS_FILE"

          # Recreate Function URL config to avoid stale auth state
          aws lambda delete-function-url-config \
            --function-name "$FUNCTION_NAME" >/dev/null 2>&1 || true

          aws lambda create-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --auth-type NONE \
            --cors file://"$CORS_FILE" \
            --query 'FunctionUrl' --output text

          rm -f "$CORS_FILE"

          # Ensure public invoke permission exists (refresh to avoid stale policy)
          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id AllowPublicInvoke >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id AllowPublicInvoke \
            --action lambda:InvokeFunctionUrl \
            --principal '*' \
            --function-url-auth-type NONE >/dev/null 2>&1 || true

          aws lambda remove-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id AllowPublicInvokeFunction >/dev/null 2>&1 || true

          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id AllowPublicInvokeFunction \
            --action lambda:InvokeFunction \
            --principal '*' \
            --invoked-via-function-url >/dev/null 2>&1 || true

          echo "Function URL config:"
          aws lambda get-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --query '{FunctionUrl:FunctionUrl,AuthType:AuthType,Cors:Cors}' \
            --output json

          echo "Function URL policy:"
          aws lambda get-policy \
            --function-name "$FUNCTION_NAME" \
            --query 'Policy' \
            --output text || true
